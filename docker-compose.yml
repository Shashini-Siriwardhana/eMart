services:
  products-service:
    build: 
      context: .
      dockerfile: src/backend/ProductsService/Dockerfile
    container_name: emart-products
    # Host:container
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ProductsDB: "Host=products-db;Port=5432;Database=productsdb;Username=postgres;Password=postgres123"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: emart
      RabbitMQ__Password: emart123
      AppSettings__Token: ${JWT_TOKEN}
      AppSettings__Issuer: ${ISSUER}
      AppSettings__Audience: ${AUDIENCE}
    depends_on:
      products-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  identity-service:
    build: 
      context: .
      dockerfile: src/backend/IdentityService/Dockerfile
    container_name: emart-users
    # Host:container
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__UsersDB: "Host=users-db;Port=5432;Database=usersdb;Username=postgres;Password=postgres123"
      AppSettings__Token: ${JWT_TOKEN}
      AppSettings__Issuer: ${ISSUER}
      AppSettings__Audience: ${AUDIENCE}
    depends_on:
      users-db:
        condition: service_healthy

  carts-service:
    build: 
      context: .
      dockerfile: src/backend/CartsService/Dockerfile
    container_name: emart-carts
    # Host:container
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CartsDB: "Host=carts-db;Port=5432;Database=cartsdb;Username=postgres;Password=postgres123"
      Services__ProductService: "http://products-service:8080"
      AppSettings__Token: ${JWT_TOKEN}
      AppSettings__Issuer: ${ISSUER}
      AppSettings__Audience: ${AUDIENCE}
    depends_on:
      products-service:
        condition: service_started
      carts-db:
        condition: service_healthy

  order-service:
    build: 
      context: .
      dockerfile: src/backend/OrderService/Dockerfile
    container_name: emart-orders
    # Host:container
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrdersDB: "Host=orders-db;Port=5432;Database=ordersdb;Username=postgres;Password=postgres123"
      Services__ProductService: "http://products-service:8080"
      Services__CartsService: "http://carts-service:8080"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: emart
      RabbitMQ__Password: emart123
      AppSettings__Token: ${JWT_TOKEN}
      AppSettings__Issuer: ${ISSUER}
      AppSettings__Audience: ${AUDIENCE}
    depends_on:
      products-service:
          condition: service_started
      carts-service:
        condition: service_started
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payments-service:
    build: 
      context: .
      dockerfile: src/backend/PaymentsService/Dockerfile
    container_name: emart-payments
    # Host:container
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PaymentsDB: "Host=payments-db;Port=5432;Database=paymentsdb;Username=postgres;Password=postgres123"
      Services__OrderService: "http://order-service:8080"
      AppSettings__Token: ${JWT_TOKEN}
      AppSettings__Issuer: ${ISSUER}
      AppSettings__Audience: ${AUDIENCE}
    depends_on:
      order-service:
          condition: service_started
      payments-db:
        condition: service_healthy
    
  yarp-gateway:
    build: 
      context: .
      dockerfile: src/backend/YarpGateway/Dockerfile
    container_name: emart-yarp
    # Host:container
    ports:
      - "5006:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - products-service
      - identity-service
      - carts-service
      - order-service
      - payments-service

  frontend:
    build:
      context: .
      dockerfile: src/frontend/web/Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    container_name: emart-frontend
    ports:
      - "3000:80"
    depends_on:
      yarp-gateway:
        condition: service_started

  products-db: 
    image: postgres:17
    container_name: emart-products-db
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: productsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    # A Docker volume stores the database outside the container's disposable filesystem.
    volumes:
      - products-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-db: 
    image: postgres:17
    container_name: emart-users-db
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: usersdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    # A Docker volume stores the database outside the container's disposable filesystem.
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usersdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  carts-db: 
    image: postgres:17
    container_name: emart-carts-db
    ports:
      - "5439:5432"
    environment:
      POSTGRES_DB: cartsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    # A Docker volume stores the database outside the container's disposable filesystem.
    volumes:
      - carts-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cartsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders-db: 
    image: postgres:17
    container_name: emart-orders-db
    ports:
      - "5440:5432"
    environment:
      POSTGRES_DB: ordersdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    # A Docker volume stores the database outside the container's disposable filesystem.
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ordersdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  payments-db: 
    image: postgres:17
    container_name: emart-payments-db
    ports:
      - "5441:5432"
    environment:
      POSTGRES_DB: paymentsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    # A Docker volume stores the database outside the container's disposable filesystem.
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paymentsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq: 
    image: rabbitmq:4-management
    container_name: emart-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: emart
      RABBITMQ_DEFAULT_PASS: emart123
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  products-db-data:
  users-db-data:
  carts-db-data:
  orders-db-data:
  payments-db-data: